name: SecureMesh v1.0.4 Radio Isolation v2

on:
  workflow_dispatch:
  push:
    branches:
      - android/1.0.4-ui-remote
    paths:
      - '.github/workflows/ui-responsiveness-optimization.yml'
      - 'ci-patches/ui-responsiveness-firmware.patch'
      - 'ci-patches/oled-mirror-load-shed.patch'
      - 'ci/ui_responsiveness_gate.py'
      - 'ci/apply_ui_responsiveness.py'
      - 'ci/align_ui_responsiveness_gates.py'
      - 'ci/apply_radio_isolation_v2.py'
      - 'ci/normalize_radio_isolation_v2.py'
      - 'ci/radio_isolation_v2_gate.py'

permissions:
  contents: write

jobs:
  verify-build-materialize:
    name: Isolate degraded radio from BLE/OLED control plane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reliability optimization
        run: |
          python3 ci/apply_ui_responsiveness.py
          python3 ci/align_ui_responsiveness_gates.py
          python3 ci/apply_radio_isolation_v2.py
          python3 ci/normalize_radio_isolation_v2.py

      - name: Verify materialized diff
        run: git diff --check

      - name: Responsiveness regression gate
        run: python3 ci/ui_responsiveness_gate.py

      - name: Radio isolation v2 architecture gate
        run: python3 ci/radio_isolation_v2_gate.py

      - name: Existing firmware and contract gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/radio_degraded_ui_gate.py
          python3 tools/firmware_arduino_preprocessor_gate.py
          python3 tools/oled_remote_action_gate.py
          python3 tools/frontend_v1_0_4_gate.py
          (
            cd android/v1.0.4/source
            python3 tools/domain_alignment_gate.py
            python3 tools/ble_contract_gate.py --firmware "$GITHUB_WORKSPACE/firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino"
          )
          python3 -m py_compile \
            ci/apply_ui_responsiveness.py \
            ci/align_ui_responsiveness_gates.py \
            ci/ui_responsiveness_gate.py \
            ci/apply_radio_isolation_v2.py \
            ci/normalize_radio_isolation_v2.py \
            ci/radio_isolation_v2_gate.py \
            tools/radio_degraded_ui_gate.py \
            tools/firmware_arduino_preprocessor_gate.py \
            tools/oled_remote_action_gate.py \
            tools/frontend_v1_0_4_gate.py \
            android/v1.0.4/source/tools/*.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: JVM unit tests
        working-directory: android/v1.0.4/source
        run: gradle --no-daemon --stacktrace --console=plain testDebugUnitTest

      - name: Android lint
        working-directory: android/v1.0.4/source
        run: gradle --no-daemon --stacktrace --console=plain lintDebug

      - name: Assemble debug APK
        working-directory: android/v1.0.4/source
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Verify APK identity
        working-directory: android/v1.0.4/source
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          aapt_bin="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$apk"
          "$aapt_bin" dump badging "$apk" | tee APK_BADGING.txt
          grep -q "package: name='dev.securemesh.commander'" APK_BADGING.txt
          grep -q "versionCode='20'" APK_BADGING.txt
          grep -q "versionName='1.0.4'" APK_BADGING.txt
          sha256sum "$apk" | tee APK_SHA256.txt

      - name: Refresh Android source manifest
        shell: bash
        run: |
          set -euo pipefail
          cd android/v1.0.4/source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rel = p.as_posix()
              if rel == 'PROJECT_MANIFEST.sha256':
                  continue
              if rel.startswith(('app/build/', 'build/', '.gradle/')):
                  continue
              if '/__pycache__/' in f'/{rel}' or rel.endswith('.pyc'):
                  continue
              if rel in {'APK_SHA256.txt', 'APK_BADGING.txt'}:
                  continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          Path('PROJECT_MANIFEST.sha256').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          sha256sum -c PROJECT_MANIFEST.sha256 >/dev/null
          ! grep -E '(^|  )(build/|app/build/|\.gradle/)|__pycache__|\.pyc$' PROJECT_MANIFEST.sha256

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v1.0.4
          fw='firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino'
          apk='android/v1.0.4/source/app/build/outputs/apk/debug/app-debug.apk'
          fw_sha="$(sha256sum "$fw" | awk '{print $1}')"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          (
            cd firmware/v1.0.4-operator
            find . -type f \
              ! -name 'SecureMeshSecrets.h' \
              ! -path './.*' \
              ! -path '*/.*' \
              -print0 | sort -z | xargs -0 sha256sum
          ) > artifacts/v1.0.4/radio-isolation-v2-firmware-manifest.sha256
          cat > artifacts/v1.0.4/radio-isolation-v2-candidate.txt <<EOF
          SecureMesh v1.0.4 radio isolation v2 candidate
          source_input_commit=$GITHUB_SHA
          workflow_run_id=$GITHUB_RUN_ID
          firmware_sha256=$fw_sha
          android_apk_sha256=$apk_sha
          evidence=CI_NATIVE_ANDROID_STATIC_FIRMWARE
          architectural_fix=RADIO_INIT_AND_FAILURE_RECOVERY_REMOVED_FROM_MAIN_LOOP
          hardware_gate=REQUIRED_RADIO_CONNECTED_AND_DISCONNECTED_A_B_RETEST
          EOF

      - name: Verify candidate package inputs
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firmware/v1.0.4-operator/SecureMeshSecrets.h
          test -f firmware/v1.0.4-operator/SecureMeshSecrets.example.h
          test -s artifacts/v1.0.4/radio-isolation-v2-firmware-manifest.sha256
          ! grep -E '  \./\.|/\.' artifacts/v1.0.4/radio-isolation-v2-firmware-manifest.sha256
          (
            cd firmware/v1.0.4-operator
            sha256sum -c "$GITHUB_WORKSPACE/artifacts/v1.0.4/radio-isolation-v2-firmware-manifest.sha256" >/dev/null
          )
          grep -q '^evidence=CI_NATIVE_ANDROID_STATIC_FIRMWARE$' artifacts/v1.0.4/radio-isolation-v2-candidate.txt
          grep -q '^hardware_gate=REQUIRED_RADIO_CONNECTED_AND_DISCONNECTED_A_B_RETEST$' artifacts/v1.0.4/radio-isolation-v2-candidate.txt

      - name: Materialize verified optimization
        shell: bash
        run: |
          set -euo pipefail
          git add \
            firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino \
            android/v1.0.4/source \
            tools/frontend_v1_0_4_gate.py \
            artifacts/v1.0.4/radio-isolation-v2-candidate.txt \
            artifacts/v1.0.4/radio-isolation-v2-firmware-manifest.sha256
          if git diff --cached --quiet; then
            echo 'Radio isolation v2 source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SecureMesh v1.0.4: isolate radio recovery from BLE OLED loop'
          git push origin HEAD:android/1.0.4-ui-remote

      - name: Upload complete candidate package
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-v1.0.4-Radio-Isolation-v2-${{ github.run_number }}
          path: |
            android/v1.0.4/source/app/build/outputs/apk/debug/app-debug.apk
            android/v1.0.4/source/APK_SHA256.txt
            android/v1.0.4/source/APK_BADGING.txt
            firmware/v1.0.4-operator/
            artifacts/v1.0.4/radio-isolation-v2-candidate.txt
            artifacts/v1.0.4/radio-isolation-v2-firmware-manifest.sha256
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
