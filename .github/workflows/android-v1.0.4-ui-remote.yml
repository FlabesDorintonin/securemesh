name: SecureMesh Android v1.0.4 UI Remote

on:
  workflow_dispatch:
  push:
    branches:
      - android/1.0.4-ui-remote
    paths:
      - '.github/workflows/android-v1.0.4-ui-remote.yml'
      - 'android/v1.0.4/ui-remote-patch/**'
      - 'android/v1.0.4/ui-remote-fixes/**'
      - 'android/v1.0.4/ui-review-fixes/**'
      - 'android/v1.0.4/ui-review-clean/**'
      - 'android/v1.0.4/source/**'
      - 'firmware/v1.0.4-operator/**'
      - 'tools/frontend_v1_0_4_gate.py'
      - 'tools/firmware_arduino_preprocessor_gate.py'
      - 'tools/oled_remote_action_gate.py'

permissions:
  contents: write

jobs:
  verify-build-materialize:
    name: Frontend, contract, tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct or verify reviewed OLED remote baseline
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/ui-remote.patch"
          cat android/v1.0.4/ui-remote-patch/part*.patch > "$patch"
          echo '7a4689761c51f1af1524698c43f33aa9a2980efd35de06c171ef4df5912b45d3  '"$patch" | sha256sum -c -
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'Reviewed OLED remote baseline already materialized.'
          elif grep -q 'GET_OLED_FRAME_CHUNK' android/v1.0.4/source/app/src/main/java/dev/securemesh/commander/data/ble/SecureMeshBleCodec.kt \
            && grep -q 'OledFramebufferSnapshot' android/v1.0.4/source/app/src/main/java/dev/securemesh/commander/domain/model/DeviceUiModels.kt \
            && grep -q 'GetOledFrameChunk = 38' firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino; then
            echo 'Reviewed OLED remote baseline is materialized with later changes; marker verification passed.'
          else
            echo 'OLED remote baseline is neither applicable nor verifiably materialized.' >&2
            exit 1
          fi
          git diff --check

      - name: Apply or verify Arduino preprocessor compile fix
        shell: bash
        run: |
          set -euo pipefail
          patch='firmware/v1.0.4-operator/patches/arduino-preprocessor-compile-fix.patch'
          echo '508052cb0aa37e21d7d56e8a545a639078740250dcd38803ced22101bdc0e962  '"$patch" | sha256sum -c -
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'Arduino compile fix already materialized.'
          elif grep -q 'BLE_OLED_FRAME_WIDTH = 128' firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino \
            && grep -q 'enum class OperationalHealthReason : uint8_t;' firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino \
            && grep -q 'enum class UiLinkGrade : uint8_t;' firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino; then
            echo 'Arduino compile fix is materialized with later changes; marker verification passed.'
          else
            echo 'Arduino compile fix is neither applicable nor verifiably materialized.' >&2
            exit 1
          fi
          git diff --check

      - name: Apply OLED remote action arbitration fix
        shell: bash
        run: |
          set -euo pipefail
          patch='android/v1.0.4/ui-remote-fixes/oled-action-arbitration.patch'
          echo 'a4cf846566f49489b94cc6a4db883a6e2c2e1d89d7ad2042152049922b36045f  '"$patch" | sha256sum -c -
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'OLED remote action fix already materialized; continuing.'
          elif grep -q 'private val actionQueue = Channel<DeviceUiAction>(capacity = 16)' android/v1.0.4/source/app/src/main/java/dev/securemesh/commander/feature/deviceui/DeviceControlViewModel.kt \
            && grep -q 'void uiCommitRemoteAction()' firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino; then
            echo 'OLED remote action v2 is materialized with later changes; marker verification passed.'
          else
            echo 'OLED remote action fix is neither cleanly applicable nor already applied.' >&2
            exit 1
          fi
          git diff --check

      - name: Apply comprehensive operator review
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/operator-review.patch"
          cat android/v1.0.4/ui-review-clean/part*.patch > "$patch"
          echo 'be2a9f9e6f5e972b08f675e39a7eea1be6a51bde7a43138ced91a3f8282d14dc  '"$patch" | sha256sum -c -
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'Operator review patch already materialized.'
          elif grep -q 'versionCode = 21' android/v1.0.4/source/app/build.gradle.kts \
            && grep -q 'secureMeshArm64Only' android/v1.0.4/source/app/build.gradle.kts \
            && grep -q 'application protocol v2' android/v1.0.4/source/app/src/main/java/dev/securemesh/commander/feature/discovery/DiscoveryScreen.kt \
            && test -f android/v1.0.4/source/app/src/test/java/dev/securemesh/commander/navigation/OperatorAppSurfaceContractTest.kt \
            && ! grep -R -n --include='*.kt' 'BLE protocol v0.2' android/v1.0.4/source/app/src/main/java; then
            echo 'Operator review is materialized with later corrections; marker verification passed.'
          else
            echo 'Operator review patch is neither applicable nor verifiably materialized.' >&2
            exit 1
          fi
          git diff --check

      - name: Arduino preprocessor declaration-order gate
        run: python3 tools/firmware_arduino_preprocessor_gate.py

      - name: OLED remote action arbitration gate
        run: python3 tools/oled_remote_action_gate.py

      - name: Frontend v1.0.4 function audit
        run: python3 tools/frontend_v1_0_4_gate.py

      - name: Architecture retention gate
        working-directory: android/v1.0.4/source
        run: python3 tools/domain_alignment_gate.py

      - name: Firmware-Android BLE cross-contract gate
        working-directory: android/v1.0.4/source
        run: python3 tools/ble_contract_gate.py --firmware "$GITHUB_WORKSPACE/firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino"

      - name: Gate syntax
        run: python3 -m py_compile tools/frontend_v1_0_4_gate.py tools/firmware_arduino_preprocessor_gate.py tools/oled_remote_action_gate.py android/v1.0.4/source/tools/*.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: JVM unit tests
        working-directory: android/v1.0.4/source
        run: gradle --no-daemon --stacktrace --console=plain testDebugUnitTest

      - name: Android lint
        working-directory: android/v1.0.4/source
        run: gradle --no-daemon --stacktrace --console=plain lintDebug

      - name: Assemble universal debug APK
        working-directory: android/v1.0.4/source
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug
          mkdir -p "$RUNNER_TEMP/apks"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/SecureMesh-v1.0.4-build21-universal.apk"

      - name: Verify universal APK identity
        working-directory: android/v1.0.4/source
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/apks/SecureMesh-v1.0.4-build21-universal.apk"
          aapt_bin="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt_bin" dump badging "$apk" | tee APK_BADGING.txt
          grep -q "package: name='dev.securemesh.commander'" APK_BADGING.txt
          grep -q "versionCode='21'" APK_BADGING.txt
          grep -q "versionName='1.0.4'" APK_BADGING.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          sha256sum "$apk" | tee APK_SHA256.txt
          stat -c '%n %s bytes' "$apk"

      - name: Assemble arm64 debug APK
        working-directory: android/v1.0.4/source
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain -PsecuremeshArm64Only=true assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/SecureMesh-v1.0.4-build21-arm64.apk"

      - name: Verify arm64 APK identity and ABI isolation
        working-directory: android/v1.0.4/source
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/apks/SecureMesh-v1.0.4-build21-arm64.apk"
          aapt_bin="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt_bin" dump badging "$apk" | tee APK_BADGING_ARM64.txt
          grep -q "package: name='dev.securemesh.commander'" APK_BADGING_ARM64.txt
          grep -q "versionCode='21'" APK_BADGING_ARM64.txt
          grep -q "versionName='1.0.4'" APK_BADGING_ARM64.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$apk" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-arm64 native library in arm64 APK' >&2
            exit 1
          fi
          sha256sum "$apk" | tee APK_SHA256_ARM64.txt
          stat -c '%n %s bytes' "$apk"

      - name: Upload APKs and matching firmware
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-Android-v1.0.4-review-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/apks/*.apk
            android/v1.0.4/source/APK_SHA256.txt
            android/v1.0.4/source/APK_SHA256_ARM64.txt
            android/v1.0.4/source/APK_BADGING.txt
            android/v1.0.4/source/APK_BADGING_ARM64.txt
            firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino
            firmware/v1.0.4-operator/APP_TEST_PANEL_PROTOCOL.md
          if-no-files-found: error
          retention-days: 30

      - name: Refresh canonical Android source manifest
        shell: bash
        run: |
          set -euo pipefail
          cd android/v1.0.4/source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rel=p.as_posix()
              if rel == 'PROJECT_MANIFEST.sha256' or rel.startswith('app/build/') or rel.startswith('.gradle/'):
                  continue
              if rel in {'APK_SHA256.txt','APK_SHA256_ARM64.txt','APK_BADGING.txt','APK_BADGING_ARM64.txt'}:
                  continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          Path('PROJECT_MANIFEST.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          sha256sum -c PROJECT_MANIFEST.sha256 >/dev/null

      - name: Materialize verified source in branch
        shell: bash
        run: |
          set -euo pipefail
          git add android/v1.0.4/source firmware/v1.0.4-operator tools/frontend_v1_0_4_gate.py tools/firmware_arduino_preprocessor_gate.py tools/oled_remote_action_gate.py
          if git diff --cached --quiet; then
            echo 'Verified Android/firmware source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SecureMesh v1.0.4: materialize comprehensive Android review'
          git push origin HEAD:android/1.0.4-ui-remote

      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified"
          cd android/v1.0.4/source
          zip -qr "$RUNNER_TEMP/verified/SecureMesh_Android_v1.0.4_REVIEWED_SOURCE.zip" . -x 'app/build/*' '.gradle/*' 'APK_SHA256.txt' 'APK_SHA256_ARM64.txt' 'APK_BADGING.txt' 'APK_BADGING_ARM64.txt'
          cd "$GITHUB_WORKSPACE"
          cp firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino "$RUNNER_TEMP/verified/"
          cp firmware/v1.0.4-operator/APP_TEST_PANEL_PROTOCOL.md "$RUNNER_TEMP/verified/"
          sha256sum "$RUNNER_TEMP/verified"/* > "$RUNNER_TEMP/verified/SHA256SUMS.txt"

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-v1.0.4-reviewed-source-${{ github.run_number }}
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          retention-days: 30
