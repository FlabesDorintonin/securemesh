name: Bare v0.9.1 Compile Proof

on:
  workflow_dispatch:
  push:
    branches:
      - agent/0.9.1-contact-vault

permissions:
  contents: read

jobs:
  bare-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Use preinstalled Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          java -version
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.9 and v0.9.1 source layers
        shell: bash
        run: |
          set -euo pipefail
          cat v09_patch_parts/part*.txt > v09_android.patch.gz.b64
          test "$(wc -c < v09_android.patch.gz.b64)" -eq 33500
          python3 tools/domain_alignment_gate.py
          git apply --check v09_maplibre_compile_fix.patch
          git apply v09_maplibre_compile_fix.patch
          git apply --check v09_test_decode_fix.patch
          git apply v09_test_decode_fix.patch
          git apply --check v09_position_fixture_fix.patch
          git apply v09_position_fixture_fix.patch
          cat v091_full_patch_parts/part*.txt > v091_full.patch.gz.b64
          test "$(wc -c < v091_full.patch.gz.b64)" -eq 24468
          base64 -d v091_full.patch.gz.b64 > v091_full.patch.gz
          gzip -dc v091_full.patch.gz > v091_full.patch
          git apply --check v091_full.patch
          git apply v091_full.patch
          git apply --check v091_security_interface_fix.patch
          git apply v091_security_interface_fix.patch
          git diff --check
          python3 tools/domain_alignment_gate.py

      - name: JVM tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest

      - name: Android lint
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --console=plain lintDebug

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
