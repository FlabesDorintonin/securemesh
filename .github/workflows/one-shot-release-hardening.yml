name: One-shot SecureMesh 0.8.3 hardening

on:
  push:
    branches:
      - agent/0.8.3-release-hardening

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/release_hardening.patch.gz.b64 | gzip -d > /tmp/release-hardening.patch
          git apply --check /tmp/release-hardening.patch
          git apply /tmp/release-hardening.patch
          rm -f tools/release_hardening.patch.gz.b64 .github/workflows/one-shot-release-hardening.yml
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Architecture and security gate
        run: python3 tools/domain_alignment_gate.py | tee alignment-gate.log

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain lintDebug 2>&1 | tee lint-debug.log

      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest 2>&1 | tee test-debug.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee assemble-debug.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SecureMesh Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release hardening 0.8.3"
          git push origin HEAD:agent/0.8.3-release-hardening

      - name: Package verified source
        run: git archive --format=zip --output=SecureMesh-0.8.3-source.zip HEAD

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-0.8.3-hardening-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-0.8.3-hardening-source-${{ github.run_number }}
          path: SecureMesh-0.8.3-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-0.8.3-hardening-failure-${{ github.run_number }}
          path: |
            alignment-gate.log
            lint-debug.log
            test-debug.log
            assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7
