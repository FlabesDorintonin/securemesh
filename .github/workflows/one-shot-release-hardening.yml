name: One-shot SecureMesh 0.8.3 hardening

on:
  push:
    branches:
      - agent/0.8.3-release-hardening

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/release_patch_chunks/* > /tmp/release-hardening.patch.gz.b64
          test "$(wc -c < /tmp/release-hardening.patch.gz.b64)" -eq 43252
          echo "425a75f4d8ae3b798dbfcc24e15dc25f71ff8eb563bdf6d604bba72af7c5cff9  /tmp/release-hardening.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/release-hardening.patch.gz.b64 | gzip -d > /tmp/release-hardening.patch
          echo "0138ffd8e53a6e49e450bdccf1c576e07328943d4feb46e9eb6fd73d7a58416c  /tmp/release-hardening.patch" | sha256sum -c -
          git apply --check /tmp/release-hardening.patch
          git apply /tmp/release-hardening.patch
          rm -rf tools/release_patch_chunks tools/release_hardening.patch.gz.b64 .github/workflows/one-shot-release-hardening.yml
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Architecture and security gate
        shell: bash
        run: |
          set -o pipefail
          python3 tools/domain_alignment_gate.py 2>&1 | tee alignment-gate.log

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain lintDebug 2>&1 | tee lint-debug.log

      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest 2>&1 | tee test-debug.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee assemble-debug.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SecureMesh Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release hardening 0.8.3"
          git push origin HEAD:agent/0.8.3-release-hardening

      - name: Package verified source
        run: git archive --format=zip --output=SecureMesh-0.8.3-source.zip HEAD

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-0.8.3-hardening-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-0.8.3-hardening-source-${{ github.run_number }}
          path: SecureMesh-0.8.3-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-0.8.3-hardening-failure-${{ github.run_number }}
          path: |
            alignment-gate.log
            lint-debug.log
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            test-debug.log
            assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7
