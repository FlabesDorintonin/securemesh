name: VANGUARD Deep Audit Research

on:
  push:
    branches:
      - research/vanguard-deep-audit-20260831
    paths:
      - 'firmware/v1.0.4-operator/**'
      - '.github/workflows/vanguard-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-matrix:
    name: Native regression (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run every native C++ test
        working-directory: firmware/v1.0.4-operator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vanguard-audit/${{ matrix.compiler }}
          for source in tests/*.cpp; do
            name="$(basename "$source" .cpp)"
            out="/tmp/vanguard-audit/${{ matrix.compiler }}/${name}"
            "${{ matrix.compiler }}" -std=c++17 -O2 -Wall -Wextra -Wpedantic -I. "$source" -o "$out"
            "$out"
          done

  invariant-stress:
    name: Core invariant stress (5M ops)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compile invariant fuzz harness
        working-directory: firmware/v1.0.4-operator
        run: g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -I. tests/vanguard_core_invariant_fuzz_test.cpp -o /tmp/vanguard-fuzz
      - name: Run five deterministic million-op seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 0xC001D00D 0x12345678 0xDEADBEEF 0x31415926 0xA5A55A5A; do
            echo "seed=$seed"
            VANGUARD_FUZZ_SEED="$seed" VANGUARD_FUZZ_OPS=1000000 /tmp/vanguard-fuzz
          done

  sanitizers:
    name: ASan + UBSan routing tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and run VANGUARD tests with sanitizers
        working-directory: firmware/v1.0.4-operator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vanguard-sanitize
          for source in tests/vanguard_*.cpp; do
            name="$(basename "$source" .cpp)"
            out="/tmp/vanguard-sanitize/${name}"
            g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -I. \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              "$source" -o "$out"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$out"
          done
