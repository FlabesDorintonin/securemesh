name: Apply SecureMesh 0.8 Product Hardening

on:
  push:
    branches:
      - product/0.8.0-hardening
    paths:
      - '.hardening/product_patch_*.b64'
      - '.github/workflows/apply-product-hardening.yml'

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: product/0.8.0-hardening
          fetch-depth: 0

      - name: Reconstruct and apply reviewed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .hardening/product_patch_*.b64 | base64 -d | gunzip > /tmp/product-hardening.patch
          git apply -p1 --check /tmp/product-hardening.patch
          git apply -p1 /tmp/product-hardening.patch
          grep -q 'versionName = "0.8.0-product-hardening"' app/build.gradle.kts
          python3 tools/domain_alignment_gate.py

      - name: Regenerate source integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \
            ! -path './.git/*' \
            ! -path './PROJECT_MANIFEST.sha256' \
            ! -path './.hardening/*' \
            ! -path './.github/workflows/apply-product-hardening.yml' \
            -print0 | sort -z | xargs -0 sha256sum > PROJECT_MANIFEST.sha256
          sha256sum -c PROJECT_MANIFEST.sha256

      - name: Commit real product source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hardening
          rm -f .github/workflows/apply-product-hardening.yml
          git config user.name 'SecureMesh CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'product: harden permissions security and UX for 0.8.0'
          git push origin HEAD:product/0.8.0-hardening
