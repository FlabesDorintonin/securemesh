name: Materialize SecureMesh Firmware Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/v1.0.4/SecureMesh_v1_0_4_OPERATOR_PUBLIC_SOURCE.zip'
      - '.github/workflows/firmware-source-sync.yml'

permissions:
  contents: write

concurrency:
  group: firmware-v1.0.4-source-sync
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    name: Materialize and verify v1.0.4 source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source archive identity
        shell: bash
        run: |
          set -euo pipefail
          expected='baff43e5eaac9d214cd4a22ec8f62d1845080d2f106345d26f06353848b032ff'
          actual="$(sha256sum artifacts/v1.0.4/SecureMesh_v1_0_4_OPERATOR_PUBLIC_SOURCE.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          echo "Verified public source SHA-256: $actual"

      - name: Materialize exact public source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/v1.0.4-operator
          mkdir -p firmware/v1.0.4-operator
          unzip -q artifacts/v1.0.4/SecureMesh_v1_0_4_OPERATOR_PUBLIC_SOURCE.zip -d firmware/v1.0.4-operator
          test -f firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino
          test -f firmware/v1.0.4-operator/VanguardRuntime.h
          test -f firmware/v1.0.4-operator/LabPanel/app.js

      - name: Publication safety gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firmware/v1.0.4-operator/SecureMeshSecrets.h
          grep -q '^SecureMeshSecrets.h$' firmware/v1.0.4-operator/.gitignore
          grep -q '#error "Configure a local LAB key' firmware/v1.0.4-operator/SecureMeshSecrets.example.h
          test "$(git grep -n 'constexpr uint8_t DEVELOPMENT_GROUP_KEY\[32\]' -- firmware/v1.0.4-operator | grep -v 'SecureMeshSecrets.example.h' | wc -l)" -eq 0

      - name: VANGUARD native regression — g++ and clang++
        shell: bash
        working-directory: firmware/v1.0.4-operator
        run: |
          set -euo pipefail
          for cxx in g++ clang++; do
            mkdir -p "/tmp/securemesh-native-$cxx"
            for source in tests/*.cpp; do
              name="$(basename "$source" .cpp)"
              output="/tmp/securemesh-native-$cxx/$name"
              "$cxx" -std=c++17 -Wall -Wextra -Wpedantic -I. "$source" -o "$output"
              "$output"
            done
          done

      - name: Commander and operator gates
        shell: bash
        working-directory: firmware/v1.0.4-operator
        run: |
          set -euo pipefail
          python3 tests/operator_vocabulary_check.py
          node --check LabPanel/app.js
          node --check LabPanel/sw.js
          node tests/operational_intelligence_check.js
          node tests/signal_intelligence_check.js
          python3 -m json.tool LabPanel/manifest.webmanifest >/dev/null

      - name: Commit materialized source tree
        shell: bash
        run: |
          set -euo pipefail
          git add firmware/v1.0.4-operator
          if git diff --cached --quiet; then
            echo 'Firmware tree already matches verified archive.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Firmware v1.0.4 OPERATOR: materialize verified public source'
          git push origin HEAD:main
