name: Apply firmware 0.6.3 alignment

on:
  push:
    branches:
      - firmware/0.6.3-alignment

permissions:
  contents: write

jobs:
  apply-reviewed-source:
    if: github.actor == 'FlabesDorintonin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed 0.6.3 alignment
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          payloads=(tools/.fw063_payload_*)
          if [ ${#payloads[@]} -eq 0 ]; then
            echo "Firmware alignment payload already applied."
            exit 0
          fi
          cat "${payloads[@]}" | base64 -d > /tmp/fw063.tar.gz
          echo "5e3dce4adcee333ed506d40edeb7b1c39c012113dfebe36989005bd11ace769a  /tmp/fw063.tar.gz" | sha256sum -c -
          tar -xzf /tmp/fw063.tar.gz
          # Workflow files are intentionally not mutated by the Actions token.
          git checkout HEAD -- .github/workflows/blank.yml
          git rm tools/.fw063_payload_*
          git config user.name "FlabesDorintonin"
          git config user.email "valiukevich.mirek@gmail.com"
          git add -A
          git reset .github/workflows/apply-fw063-alignment.yml .github/workflows/blank.yml || true
          git commit -m "Firmware 0.6.3: align Android BLE UI OS contract"
          git push origin HEAD:firmware/0.6.3-alignment
