name: Apply firmware 0.6.3 alignment

on:
  push:
    branches:
      - firmware/0.6.3-alignment

permissions:
  contents: write

jobs:
  apply-reviewed-source:
    if: github.actor == 'FlabesDorintonin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed 0.6.3 alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          output = bytearray()
          alphabet = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          for path in sorted(Path("tools").glob(".fw063_payload_*")):
              text = ''.join(ch for ch in path.read_text(encoding="utf-8") if ch in alphabet)
              segment = []
              for ch in text:
                  segment.append(ch)
                  if ch == '=' and len(segment) % 4 == 0:
                      output.extend(base64.b64decode(''.join(segment), validate=False))
                      segment.clear()
              if segment:
                  raw = ''.join(segment)
                  raw += '=' * ((4 - len(raw) % 4) % 4)
                  output.extend(base64.b64decode(raw, validate=False))
          Path('/tmp/fw063.tar.gz').write_bytes(output)
          PY
          echo "5bf72a24135180ae9df52da2a3fc366df3976ee299f355884116753a33e821a4  /tmp/fw063.tar.gz" | sha256sum -c -
          tar -xzf /tmp/fw063.tar.gz
          git rm tools/.fw063_payload_*
          git rm .github/workflows/apply-fw063-alignment.yml
          git config user.name "FlabesDorintonin"
          git config user.email "valiukevich.mirek@gmail.com"
          git add -A
          git commit -m "Firmware 0.6.3: align Android BLE UI OS contract"
          git push origin HEAD:firmware/0.6.3-alignment
