name: Build SecureMesh Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - product/0.8.0-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Architecture alignment gate
        shell: bash
        run: |
          set -o pipefail
          python3 tools/domain_alignment_gate.py 2>&1 | tee alignment-gate.log

      - name: Upload alignment failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-alignment-failure-log-${{ github.run_number }}
          path: alignment-gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run JVM unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest > test-debug.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "----- concise Gradle/Kotlin failure -----"
            grep -E "^(e: |FAILURE:|\* What went wrong:|Execution failed for task|Caused by:|> Task .* FAILED)" test-debug.log | head -n 200 || true
            echo "----- tail -----"
            tail -n 100 test-debug.log
          else
            tail -n 30 test-debug.log
          fi
          exit "$code"

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-test-failure-log-${{ github.run_number }}
          path: test-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain assembleDebug > assemble-debug.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^(e: |FAILURE:|\* What went wrong:|Execution failed for task|Caused by:|> Task .* FAILED)" assemble-debug.log | head -n 200 || true
            tail -n 100 assemble-debug.log
          else
            tail -n 30 assemble-debug.log
          fi
          exit "$code"

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-build-failure-log-${{ github.run_number }}
          path: assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SecureMesh APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package source snapshot
        run: git archive --format=zip --output=SecureMesh-source-${{ github.run_number }}.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-source-${{ github.run_number }}
          path: SecureMesh-source-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14
