name: Build and Verify SecureMesh

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-firmware-source:
    name: Materialize verified firmware v1.0.4 source
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public source archive SHA-256
        shell: bash
        run: |
          set -euo pipefail
          expected='baff43e5eaac9d214cd4a22ec8f62d1845080d2f106345d26f06353848b032ff'
          actual="$(sha256sum artifacts/v1.0.4/SecureMesh_v1_0_4_OPERATOR_PUBLIC_SOURCE.zip | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "verified public source $actual"

      - name: Materialize firmware/VANGUARD/Commander tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/v1.0.4-operator
          mkdir -p firmware/v1.0.4-operator
          unzip -q artifacts/v1.0.4/SecureMesh_v1_0_4_OPERATOR_PUBLIC_SOURCE.zip -d firmware/v1.0.4-operator
          test -f firmware/v1.0.4-operator/SecureMesh_v1_0_4_OPERATOR.ino
          test -f firmware/v1.0.4-operator/VanguardRuntime.h
          test -f firmware/v1.0.4-operator/LabPanel/app.js

      - name: Publication safety gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firmware/v1.0.4-operator/SecureMeshSecrets.h
          grep -qx 'SecureMeshSecrets.h' firmware/v1.0.4-operator/.gitignore
          grep -q '#error "Configure a local LAB key' firmware/v1.0.4-operator/SecureMeshSecrets.example.h
          if grep -R -n --include='*.ino' --include='*.h' 'DEVELOPMENT_GROUP_KEY\[32\]' firmware/v1.0.4-operator | grep -v 'SecureMeshSecrets.example.h'; then
            echo 'tracked real LAB group-key definition detected' >&2
            exit 1
          fi

      - name: VANGUARD native regression
        shell: bash
        working-directory: firmware/v1.0.4-operator
        run: |
          set -euo pipefail
          for cxx in g++ clang++; do
            mkdir -p "/tmp/securemesh-$cxx"
            for source in tests/*.cpp; do
              name="$(basename "$source" .cpp)"
              output="/tmp/securemesh-$cxx/$name"
              "$cxx" -std=c++17 -Wall -Wextra -Wpedantic -I. "$source" -o "$output"
              "$output"
            done
          done

      - name: Commander and operator gates
        shell: bash
        working-directory: firmware/v1.0.4-operator
        run: |
          set -euo pipefail
          python3 tests/operator_vocabulary_check.py
          node --check LabPanel/app.js
          node --check LabPanel/sw.js
          node tests/operational_intelligence_check.js
          node tests/signal_intelligence_check.js
          python3 -m json.tool LabPanel/manifest.webmanifest >/dev/null

      - name: Commit materialized source to main
        shell: bash
        run: |
          set -euo pipefail
          git add firmware/v1.0.4-operator
          if git diff --cached --quiet; then
            echo 'firmware tree already matches verified public source'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Firmware v1.0.4 OPERATOR: materialize verified public source'
          git push origin HEAD:main

  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Architecture alignment gate
        shell: bash
        run: |
          set -o pipefail
          python3 tools/domain_alignment_gate.py 2>&1 | tee alignment-gate.log

      - name: Upload alignment failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-alignment-failure-log-${{ github.run_number }}
          path: alignment-gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run JVM unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest > test-debug.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "----- concise Gradle/Kotlin failure -----"
            grep -E "^(e: |FAILURE:|\* What went wrong:|Execution failed for task|Caused by:|> Task .* FAILED)" test-debug.log | head -n 200 || true
            echo "----- tail -----"
            tail -n 100 test-debug.log
          else
            tail -n 30 test-debug.log
          fi
          exit "$code"

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-test-failure-log-${{ github.run_number }}
          path: test-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain assembleDebug > assemble-debug.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^(e: |FAILURE:|\* What went wrong:|Execution failed for task|Caused by:|> Task .* FAILED)" assemble-debug.log | head -n 200 || true
            tail -n 100 assemble-debug.log
          else
            tail -n 30 assemble-debug.log
          fi
          exit "$code"

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-build-failure-log-${{ github.run_number }}
          path: assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SecureMesh APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package source snapshot
        run: git archive --format=zip --output=SecureMesh-source-${{ github.run_number }}.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SecureMesh-source-${{ github.run_number }}
          path: SecureMesh-source-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14
